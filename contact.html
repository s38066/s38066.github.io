<!doctype html>
<html lang="th">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — NON</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="assets/style.css">

</head>


<body>


<header class="site-header">

  <a class="brand" href="index.html">

    <span class="brand-cat">
      🐱
    </span>

    <span>
      NON'S PIXEL PORTFOLIO
    </span>

  </a>


  <button class="menu-toggle" aria-label="เปิดเมนู">
    ☰
  </button>


  <nav class="nav">

    <a href="index.html">
      ⌂ HOME
    </a>

    <a href="about.html">
      ♡ ABOUT
    </a>

    <a href="portfolio.html">
      ✦ PORTFOLIO
    </a>

    <a class="active" href="contact.html">
      ✉ CONTACT
    </a>

  </nav>

</header>



<main>


  <!-- TITLE -->

  <section class="page-head shell">

    <p class="eyebrow">
      LET'S TALK ✦
    </p>

    <h1>
      CONTACT <span>ME</span>
    </h1>

    <p>
      มีโปรเจกต์หรืออยากพูดคุย
      ส่งข้อความมาได้เลย
    </p>

  </section>



  <!-- CONTACT -->

  <section class="contact-grid shell">


    <!-- CONTACT INFORMATION -->

    <div class="contact-card paper">

      <div class="contact-icon">
        💌
      </div>


      <h2>
        ช่องทางติดต่อ
      </h2>


      <a href="s38066@banbung.ac.th">
        ✉ Gmail
      </a>


      <a
        href="https://github.com/s38066"
        target="_blank"
        rel="noopener"
      >
        ⌘ github.com
      </a>


      <a
        href="https://www.instagram.com/n.nxlluvk1tty/"
        target="_blank"
        rel="noopener"
      >
        ◎ n.nxlluvk1tty
      </a>

    </div>



    <!-- CONTACT FORM -->

    <form
      class="paper contact-form"
      action="https://formsubmit.co/hello@example.com"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        value="ข้อความจาก Portfolio"
      >

      <input
        type="hidden"
        name="_captcha"
        value="false"
      >


      <label>

        ชื่อ

        <input
          name="name"
          required
          placeholder="ชื่อของคุณ"
        >

      </label>


      <label>

        อีเมล

        <input
          type="email"
          name="email"
          required
          placeholder="you@example.com"
        >

      </label>


      <label>

        ข้อความ

        <textarea
          name="message"
          required
          rows="6"
          placeholder="เล่าโปรเจกต์หรือสิ่งที่อยากคุย..."
        ></textarea>

      </label>


      <button
        class="btn primary"
        type="submit"
      >
        ส่งข้อความ ♡
      </button>


      <small>
        หมายเหตุ:
        เปลี่ยน hello@example.com
        ในไฟล์นี้เป็นอีเมลจริงของคุณก่อนใช้งาน
      </small>

    </form>

  </section>

</main>



<footer class="footer">

  <span>
    Made with ♡ & pixels
  </span>

  <span>

    <a href="index.html">
      กลับหน้าแรก ↑
    </a>

  </span>

</footer>



<script src="assets/script.js"></script>

</body>
</html>
